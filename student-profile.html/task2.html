<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        div {
            border: 2px solid black;
            padding: 20px;
            margin: 10px;
            width: 300px;
            height: 80px;
        }

        .second {
            background-color: lightblue;
            color: darkblue;
        }

        #third {
            background-color: lightgray;
            color: darkred;
        }
    </style>
</head>

<body>

    <div>
        This is the first div.
    </div>

    <div class="second">
        This is the second div.
    </div>

    <div id="third">
        This is the third div.
    </div>

</body>
</html>
